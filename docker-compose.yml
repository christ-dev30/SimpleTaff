version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: simplethree_postgres
    restart: always
    environment:
      POSTGRES_DB: simpletaff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simpletaff"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simplethree_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simpletaff
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: c2ltcGxldGhyZWUtc2VjdXJlLWp3dC1zZWNyZXQta2V5LTIwMjYtc3BlY2lhbA==

volumes:
  postgres_data:
